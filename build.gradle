plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = '1.1.2'
group = 'cn.serversync'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.219'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { serversync { sourceSet sourceSets.main } }
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'JUnitCentral'; url = 'https://repo.maven.apache.org/maven2' } }
        filter { includeGroupByRegex('org.junit.*'); includeGroup('org.opentest4j'); includeGroup('org.apiguardian') }
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft supplies these at runtime; plain JUnit tests need their own classpath.
    testImplementation 'io.netty:netty-handler:4.1.97.Final'
    testImplementation 'io.netty:netty-codec:4.1.97.Final'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform(); dependsOn jar; systemProperty 'serversync.test.jar', tasks.jar.archiveFile.get().asFile.absolutePath }
jar { manifest { attributes 'Main-Class': 'cn.serversync.UpdateHelper' } }
